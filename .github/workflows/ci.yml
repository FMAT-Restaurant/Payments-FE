name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-verify:
    name: "Build, Lint & Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Estrictamente requerido por SonarQube para analizar la historia completa

      - name: "setup pnpm"
        uses: pnpm/action-setup@v4

      - name: "setup node"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: "install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "verify formatting (lint)"
        run: pnpm lint

      # Ejecuta las pruebas y genera el archivo lcov.info en la carpeta coverage/
      - name: "run tests and coverage"
        run: pnpm test -- --coverage 

      - name: "build"
        run: pnpm build

      - name: "SonarQube Scan"
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.organization=fmat-restaurant
            -Dsonar.projectKey=FMAT-Restaurant_Payments-FE # <-- IMPORTANTE: Pon tu Project Key real aquí
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification on failure
        if: failure()
        uses: Ilshidur/action-discord@ad5235de713df3ef38022185499b02ffe93b7efe
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with: 
          args: 'Pipeline de CI falló en ${{ github.ref_name }} por ${{ github.actor }}'