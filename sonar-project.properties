sonar.organization=fmat-restaurant
sonar.projectKey=FMAT-Restaurant_Payments-FE

# Production code and tests both live under src/; test files are indexed only as tests.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/test/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/test/**

# Coverage produced by `pnpm test` (Vitest + v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/mocks/**,src/main.tsx,src/vite-env.d.ts
